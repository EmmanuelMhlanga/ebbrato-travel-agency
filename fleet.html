<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Fleet | EBBRATO TRAVEL</title>
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .fleet-image {
            filter: grayscale(100%);
            opacity: 0.9;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            /* Changed to contain or better centered cover to prevent extreme zoom */
            object-fit: cover; 
            object-position: center;
            width: 100%;
            height: 100%;
        }
        .group:hover .fleet-image {
            filter: grayscale(0%);
            opacity: 1;
            transform: scale(1.05); /* Reduced scale so it doesn't zoom too much on hover */
        }
        .card-container { 
            background-color: #0f172a; 
            overflow: hidden;
        }
    </style>
</head>
<body class="beach-theme text-white flex flex-col min-h-screen bg-slate-950">
    
    <nav class="fixed w-full z-50 p-6 flex justify-between items-center bg-slate-950/90 backdrop-blur-md border-b border-white/5">
        <div class="flex items-center text-xl font-black uppercase tracking-tighter">
            <img src="favicon.png" alt="Logo" class="w-10 h-10 mr-3">
            <span>EBBRATO <span class="gold-text">TRAVEL</span></span>
        </div>
        <div class="hidden md:flex space-x-8 text-[10px] font-black uppercase tracking-widest">
            <a href="index.html" class="hover:text-yellow-500 transition">Home</a>
            <a href="about.html" class="hover:text-yellow-500 transition">About</a>
            <a href="packages.html" class="hover:text-yellow-500 transition">Tours</a>
            <a href="fleet.html" class="gold-text">Fleet</a>
            <a href="gallery.html" class="hover:text-yellow-500 transition">Gallery</a>
            <a href="contact.html" class="hover:text-yellow-500 transition border-l border-white/20 pl-8">Contact</a>
        </div>
    </nav>

    <div class="h-40"></div>

    <main class="flex-grow mb-20 px-6">
        <section class="max-w-7xl mx-auto">
            <div class="text-center mb-16">
                <h2 class="text-5xl font-black uppercase italic tracking-tighter">Elite <span class="gold-text">Logistics</span></h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <div class="relative group rounded-[40px] aspect-video card-container border border-white/10 shadow-2xl">
                    <img src="uber.jpg" class="fleet-image absolute inset-0" alt="Uber Black">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent p-8 flex flex-col justify-end">
                        <h3 class="text-2xl font-black uppercase italic tracking-tighter mb-1">Executive Class</h3>
                        <p class="text-[9px] font-bold uppercase tracking-widest text-yellow-500">Uber Black Standard</p>
                    </div>
                </div>

                <div class="relative group rounded-[40px] aspect-video card-container border border-white/10 shadow-2xl">
                    <img src="plane.jpg" class="fleet-image absolute inset-0" alt="FlySafair">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent p-8 flex flex-col justify-end">
                        <h3 class="text-2xl font-black uppercase italic tracking-tighter mb-1">Air Travel</h3>
                        <p class="text-[9px] font-bold uppercase tracking-widest text-yellow-500">FlySafair & Charters</p>
                    </div>
                </div>

                <div class="relative group rounded-[40px] aspect-video card-container border border-white/10 shadow-2xl">
                    <img src="gautrain.jpg" class="fleet-image absolute inset-0" alt="Gautrain">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent p-8 flex flex-col justify-end">
                        <h3 class="text-2xl font-black uppercase italic tracking-tighter mb-1">Gautrain Link</h3>
                        <p class="text-[9px] font-bold uppercase tracking-widest text-yellow-500">Rapid Rail Transfers</p>
                    </div>
                </div>

                <div class="relative group rounded-[40px] aspect-video card-container border border-white/10 shadow-2xl">
                    <img src="cruise.jpg" class="fleet-image absolute inset-0" alt="Boat Cruise">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent p-8 flex flex-col justify-end">
                        <h3 class="text-2xl font-black uppercase italic tracking-tighter mb-1">Marine Cruise</h3>
                        <p class="text-[9px] font-bold uppercase tracking-widest text-yellow-500">Luxury Yacht Experience</p>
                    </div>
                </div>

                <div class="relative group rounded-[40px] aspect-video card-container border border-white/10 shadow-2xl">
                    <img src="bus.jpg" class="fleet-image absolute inset-0" alt="Double Decker">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent p-8 flex flex-col justify-end">
                        <h3 class="text-2xl font-black uppercase italic tracking-tighter mb-1">Grand Touring</h3>
                        <p class="text-[9px] font-bold uppercase tracking-widest text-yellow-500">Luxury Coach</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="py-16 bg-black text-center">
        <p class="text-[10px] font-bold uppercase tracking-[0.4em] text-white/70">EBBRATO TRAVEL • LUXURY IN MOTION</p>
    </footer>
</body>
</html>
