<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBBRATO TRAVEL | Your Guide to Travel & Adventure</title>
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Animated Water Background (Consistent with other pages) */
        .water-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), 
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            animation: waterMove 20s infinite alternate ease-in-out;
        }

        @keyframes waterMove {
            0% { transform: scale(1); background-position: center; }
            100% { transform: scale(1.1); background-position: top; }
        }

        /* Moving Text Animation */
        .reveal-up {
            animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .gold-text {
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Mobile Menu Animation */
        #mobile-menu.active {
            display: flex;
            animation: slideDown 0.3s ease-out forwards;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-950 text-white flex flex-col min-h-screen overflow-x-hidden">

    <div class="water-bg"></div>

    <nav class="fixed w-full z-[100] p-6 bg-slate-950/90 backdrop-blur-md border-b border-white/5">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            
            <div class="flex items-center text-xl font-black uppercase tracking-tighter">
                <img src="favicon.png" alt="Logo" class="w-10 h-10 mr-3">
                <span>EBBRATO <span class="gold-text">TRAVEL</span></span>
            </div>

            <div class="hidden md:flex space-x-8 text-[10px] font-black uppercase tracking-widest">
                <a href="index.html" class="gold-text">Home</a>
                <a href="about.html" class="hover:text-yellow-500 transition">About</a>
                <a href="packages.html" class="hover:text-yellow-500 transition">Tours</a>
                <a href="fleet.html" class="hover:text-yellow-500 transition">Fleet</a>
                <a href="gallery.html" class="hover:text-yellow-500 transition">Gallery</a>
                <a href="contact.html" class="hover:text-yellow-500 transition border-l border-white/20 pl-8">Contact</a>
            </div>

            <button id="menu-toggle" class="md:hidden text-white p-2 focus:outline-none">
                <i class="fas fa-bars text-2xl" id="menu-icon"></i>
            </button>
        </div>

        <div id="mobile-menu" class="hidden flex-col absolute top-full left-0 w-full bg-slate-950 border-b border-white/10 p-8 space-y-6 text-center text-[12px] font-black uppercase tracking-[0.3em] md:hidden shadow-2xl">
            <a href="index.html" class="gold-text py-2">Home</a>
            <a href="about.html" class="hover:text-yellow-500 transition py-2 border-t border-white/5">About</a>
            <a href="packages.html" class="hover:text-yellow-500 transition py-2 border-t border-white/5">Tours</a>
            <a href="fleet.html" class="hover:text-yellow-500 transition py-2 border-t border-white/5">Fleet</a>
            <a href="gallery.html" class="hover:text-yellow-500 transition py-2 border-t border-white/5">Gallery</a>
            <a href="contact.html" class="bg-white text-black py-4 rounded-full mt-4">Contact</a>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center pt-20">
        <section class="text-center px-6 reveal-up">
            <p class="text-[10px] uppercase tracking-[0.8em] opacity-60 mb-4">Elite Logistics & Curated Heritage</p>
            <h1 class="text-6xl md:text-8xl font-black uppercase italic tracking-tighter leading-none mb-6">
                Your Guide To <br> <span class="gold-text">Travel & Adventure</span>
            </h1>
            <div class="flex flex-col md:flex-row justify-center gap-4 mt-8">
                <a href="packages.html" class="px-8 py-4 bg-white text-black text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-yellow-600 hover:text-white transition">Explore Tours</a>
                <a href="contact.html" class="px-8 py-4 border border-white/20 text-[10px] font-black uppercase tracking-widest rounded-full hover:bg-white hover:text-black transition">Book Inquiry</a>
            </div>
        </section>
    </main>

    <footer class="py-16 bg-black/60 backdrop-blur-md border-t border-white/10 text-center w-full relative z-10">
        <p class="text-[10px] font-bold uppercase tracking-[0.4em] text-white/70">
            Johannesburg • Soweto • Cape Town and Beyond
        </p>
        <p class="text-[8px] opacity-30 uppercase tracking-widest mt-6">
            &copy; 2026 EBBRATO TRAVEL • BY GASA TECH
        </p>
    </footer>

    <a href="https://wa.me/27639938057" class="fixed bottom-8 right-8 bg-green-500 text-white w-14 h-14 rounded-full flex items-center justify-center text-2xl z-50 shadow-2xl hover:scale-110 transition">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const menuIcon = document.getElementById('menu-icon');

        menuToggle.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            mobileMenu.classList.toggle('active');
            
            if (mobileMenu.classList.contains('active')) {
                menuIcon.classList.remove('fa-bars');
                menuIcon.classList.add('fa-times');
            } else {
                menuIcon.classList.remove('fa-times');
                menuIcon.classList.add('fa-bars');
            }
        });

        // Close menu if a link is clicked
        const navLinks = mobileMenu.querySelectorAll('a');
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
                mobileMenu.classList.remove('active');
                menuIcon.classList.remove('fa-times');
                menuIcon.classList.add('fa-bars');
            });
        });
    </script>

</body>
</html>
