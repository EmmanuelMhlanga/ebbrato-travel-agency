<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | EBBRATO TRAVEL</title>
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Animated Water Background */
        .bg-animated-water {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            animation: waterMove 25s infinite alternate ease-in-out;
        }

        @keyframes waterMove {
            0% { transform: scale(1.0); }
            100% { transform: scale(1.15); }
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Input Styling */
        input, select, textarea {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: white !important;
        }

        /* THE FIX FOR THE DROPDOWN WHITE BOX */
        select option {
            background-color: #0f172a !important; /* Matches slate-950 */
            color: white !important;
            padding: 10px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #eab308 !important;
            outline: none;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.3);
        }

        .gold-gradient-text {
            background: linear-gradient(45deg, #eab308, #fef08a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="text-white flex flex-col min-h-screen bg-slate-950 overflow-x-hidden">

    <div class="bg-animated-water"></div>
    
    <nav class="fixed w-full z-50 p-6 flex justify-between items-center bg-slate-950/80 backdrop-blur-md border-b border-white/5">
        <div class="flex items-center text-xl font-black uppercase tracking-tighter">
            <img src="favicon.png" alt="Logo" class="w-10 h-10 mr-3">
            <span>EBBRATO <span class="gold-gradient-text">TRAVEL</span></span>
        </div>
        <div class="hidden md:flex space-x-8 text-[10px] font-black uppercase tracking-widest">
            <a href="index.html" class="hover:text-yellow-500 transition">Home</a>
            <a href="about.html" class="hover:text-yellow-500 transition">About</a>
            <a href="packages.html" class="hover:text-yellow-500 transition">Tours</a>
            <a href="fleet.html" class="hover:text-yellow-500 transition">Fleet</a>
            <a href="gallery.html" class="hover:text-yellow-500 transition">Gallery</a>
            <a href="contact.html" class="text-yellow-500 border-l border-white/20 pl-8 font-black">Contact</a>
        </div>
    </nav>

    <div class="h-40"></div>

    <main class="flex-grow container mx-auto px-6 mb-20">
        <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
            
            <div class="space-y-10">
                <h1 class="text-7xl font-black uppercase italic tracking-tighter leading-none">
                    Let's Plan <br><span class="gold-gradient-text">Your Escape</span>
                </h1>
                
                <div class="space-y-8">
                    <div class="flex items-center space-x-6">
                        <div class="w-14 h-14 glass-card rounded-2xl flex items-center justify-center text-yellow-500 shadow-xl">
                            <i class="fas fa-phone-alt text-xl"></i>
                        </div>
                        <div>
                            <p class="text-[9px] uppercase tracking-[0.3em] text-gray-500 font-bold">24/7 Concierge</p>
                            <p class="text-xl font-black">+27 63 993 8057</p>
                        </div>
                    </div>

                    <div class="flex items-center space-x-6">
                        <div class="w-14 h-14 glass-card rounded-2xl flex items-center justify-center text-yellow-500 shadow-xl">
                            <i class="fas fa-envelope text-xl"></i>
                        </div>
                        <div>
                            <p class="text-[9px] uppercase tracking-[0.3em] text-gray-500 font-bold">Inquiries</p>
                            <p class="text-xl font-black italic">info@ebbratotravel.co.za</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass-card p-10 md:p-12 rounded-[50px] shadow-2xl relative">
                <form action="#" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] uppercase tracking-widest font-black text-yellow-500/80 ml-2">Full Name</label>
                            <input type="text" placeholder="Lerato Moloi" class="w-full p-5 rounded-2xl">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] uppercase tracking-widest font-black text-yellow-500/80 ml-2">Email Address</label>
                            <input type="email" placeholder="client@example.com" class="w-full p-5 rounded-2xl">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] uppercase tracking-widest font-black text-yellow-500/80 ml-2">Your Destination</label>
                        <select class="w-full p-5 rounded-2xl appearance-none cursor-pointer">
                            <option value="" disabled selected>Select a Tour...</option>
                            <option value="gold-city">The Gold City (Johannesburg)</option>
                            <option value="mother-city">The Mother City (Cape Town)</option>
                            <option value="wild-mzansi">Wild Mzansi (Kruger Safari)</option>
                            <option value="panorama">Panorama Route</option>
                            <option value="durban">Durban Coast</option>
                            <option value="cradle">Cradle Heritage</option>
                            <option value="general">General Travel Inquiry</option>
                        </select>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] uppercase tracking-widest font-black text-yellow-500/80 ml-2">Message</label>
                        <textarea rows="4" placeholder="How can we make your trip legendary?" class="w-full p-5 rounded-2xl"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-yellow-500 hover:bg-white text-black font-black uppercase tracking-[0.2em] py-6 rounded-2xl transition-all duration-500 shadow-lg hover:shadow-yellow-500/20">
                        Send Inquiry
                    </button>
                </form>
            </div>

        </div>
    </main>

    <footer class="py-10 text-center opacity-40">
        <p class="text-[9px] font-bold uppercase tracking-[0.5em]">EBBRATO TRAVEL • SOUTH AFRICA</p>
    </footer>

    <a href="https://wa.me/27639938057" class="fixed bottom-10 right-10 bg-[#25D366] text-white w-16 h-16 rounded-full flex items-center justify-center text-3xl z-50 shadow-2xl hover:scale-110 transition-transform">
        <i class="fab fa-whatsapp"></i>
    </a>

</body>
</html>
