<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/png" href="favicon.png?v=2">

    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Animated Water Background Effect */
        .bg-animated-water {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), 
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            animation: waterMove 20s infinite alternate ease-in-out;
        }

        @keyframes waterMove {
            0% { transform: scale(1.0); background-position: center; }
            100% { transform: scale(1.1); background-position: bottom; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        input, select, textarea {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: white !important;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #eab308 !important; /* Gold color */
            outline: none;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.2);
        }

        .gold-gradient-text {
            background: linear-gradient(45deg, #eab308, #fef08a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

                    <div class="space-y-6">
                        <div class="flex items-center space-x-4 group">
